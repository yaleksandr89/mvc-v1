services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        APP_UID: ${HOST_UID}
        APP_GID: ${HOST_GID}
    env_file:
      - .env.docker
    environment:
      PHP_IDE_CONFIG: serverName=mvc-v1
    volumes:
      - .:/var/www/html
      - composer-home:/home/app/.composer
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.30.4-alpine3.24
    ports:
      - "127.0.0.1:${APP_PORT}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php:
        condition: service_started
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18.4-alpine3.24
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docs/db_schema_only.sql:/docker-entrypoint-initdb.d/10-mvc-v1-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  postgres-data:
  composer-home:
