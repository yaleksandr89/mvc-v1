# Пример для ручного запуска: адаптируйте server_name, root и fastcgi_pass под свою систему.
server {
    listen 80;
    server_name mvc-v1.local;

    root /var/www/mvc-v1/public;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # Путь к сокету PHP-FPM зависит от системы.
    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    # Выполнять PHP разрешено только через входной скрипт.
    location ~ \.php$ {
        return 404;
    }
}
