# Example only: adjust server_name, root and fastcgi_pass for your system.
server {
    listen 80;
    server_name mvc-v1.local;

    root /var/www/mvc-v1/public;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # The PHP-FPM socket path differs between distributions.
    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    # Only the front controller may execute PHP.
    location ~ \.php$ {
        return 404;
    }
}
